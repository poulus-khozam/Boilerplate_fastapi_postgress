version: "3.10"
services:
  fastapi_app:
    build:  
      context: ./npc_be/.
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./npc_be/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1    
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALCHEMY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    networks:
      testdb:
        ipv4_address: 172.17.0.5

networks:
  testdb:
    external: true    # Use existing network instead of creating new one
    name: testdb      # Exact name of your existing network
